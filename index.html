<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مزرعة الأبطال التعليمية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>مزرعة الأبطال 🚜</h1>
    
    <div id="game-container">
        <!-- لوحة التحكم والفهرس -->
        <div id="controls">
            <div class="control-box">
                <label for="lesson-index">فهرس الدروس:</label>
                <select id="lesson-index" onchange="jumpToLesson()"></select>
            </div>
            <button id="ask-btn" onclick="drawQuestion()">اسحب سؤال 📝</button>
            <p id="message">أجب على الأسئلة لتبني مزرعتك!</p>
        </div>

        <!-- المزرعة (شبكة فارغة تملأ بالجوائز) -->
        <div id="farm-grid">
            <!-- سيتم توليد 20 مربع برمجياً -->
        </div>
    </div>

    <!-- مربع السؤال والشرح -->
    <div id="quiz-modal" class="hidden">
        <div class="modal-content">
            
            <!-- قسم الشرح -->
            <div id="lesson-section" class="hidden">
                <h2 id="lesson-title"></h2>
                <div class="lesson-box">
                    <p id="lesson-text"></p>
                </div>
                <button id="understand-btn" onclick="showQuestion()" class="action-btn">فهمت، اعرض السؤال 🚀</button>
            </div>
            
            <!-- قسم السؤال -->
            <div id="question-section" class="hidden">
                <p id="chapter-branch-label" class="badge"></p>
                <h3 id="question-counter"></h3>
                <h2 id="question-text"></h2>
                <div id="options"></div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
